# Settings for the Ultimate Linux Claude tools (ask, ultimate-mcp).
# Override per user in ~/.config/ultimate/claude.conf.
# Credentials never go here. Sign in with `ask --login` (your Claude
# subscription, through Claude Code) or store an API key with `ask --api-key`.
# Which engine answers: "auto" (Claude Code with your Claude subscription
# when you're signed in, otherwise an API key), "claude-code", or "api".
CLAUDE_ENGINE=auto
# Model for the API engine. Claude Code uses its own default unless
# CLAUDE_CODE_MODEL is set.
CLAUDE_MODEL=claude-opus-5

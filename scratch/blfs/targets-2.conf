# Stage 2 of the desktop layer: what the Ultimate layer needs on top of
# Plasma. libadwaita, WebKitGTK (6.0 API) and VTE (GTK 4) for Ultimate Mail
# and Ultimate SSH; the networking tools BLFS carries. (Others are written
# by hand in blfs/extra-2/.)
optDependency=2
CONFIG_libadwaita1=y
CONFIG_webkitgtk=y
CONFIG_vte=y
CONFIG_net-tools=y
CONFIG_bind-utils=y
CONFIG_whois=y
CONFIG_nmap=y
CONFIG_wireshark=y
CONFIG_rsync=y
CONFIG_lsof=y
CONFIG_iw=y
LANGUAGE=en_US.UTF-8
SUDO=n
WRAP_INSTALL=n
DEL_LA_FILES=y
STATS=n
SRC_ARCHIVE=/sources
BUILD_ROOT=/sources/blfs
BUILD_SUBDIRS=y
JOBS=0
CFG_CFLAGS=EMPTY
CFG_CXXFLAGS=EMPTY
CFG_LDFLAGS=EMPTY

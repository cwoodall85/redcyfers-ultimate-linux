# What the from-source system builds on top of LFS, via the BLFS tools.
# One BLFS package id per CONFIG_ line; dependencies are resolved from the
# BLFS 13.1 book. optDependency: 1 required, 2 +recommended (BLFS's own
# assumption), 3 +optional for these targets, 4 everything.
optDependency=2
CONFIG_plasma-build=y
CONFIG_plasma-post-install=y
CONFIG_sddm=y
CONFIG_konsole=y
CONFIG_dolphin=y
CONFIG_kate=y
CONFIG_ark=y
CONFIG_spectacle=y
# Build settings for the generated scripts.
LANGUAGE=en_US.UTF-8
SUDO=n
WRAP_INSTALL=n
DEL_LA_FILES=y
STATS=n
SRC_ARCHIVE=/sources
BUILD_ROOT=/sources/blfs
# One build directory per package: side downloads (systemd units) read an
# "unpacked" list from their build directory, and a shared one is stale.
BUILD_SUBDIRS=y
JOBS=0
CFG_CFLAGS=EMPTY
CFG_CXXFLAGS=EMPTY
CFG_LDFLAGS=EMPTY

# Stage 3: what installing to a real disk needs. dosfstools for the EFI
# system partition, efibootmgr for the firmware's boot entries, gptfdisk
# for GPT disks, sudo for administration, alsa-utils (aplay, alsamixer). (GRUB for UEFI and the kernel rebuild are in extra-3.)
optDependency=2
CONFIG_dosfstools=y
CONFIG_efibootmgr=y
CONFIG_gptfdisk=y
CONFIG_sudo=y
CONFIG_alsa-utils=y
LANGUAGE=en_US.UTF-8
SUDO=n
WRAP_INSTALL=n
DEL_LA_FILES=y
STATS=n
SRC_ARCHIVE=/sources
BUILD_ROOT=/sources/blfs
BUILD_SUBDIRS=y
JOBS=0
CFG_CFLAGS=EMPTY
CFG_CXXFLAGS=EMPTY
CFG_LDFLAGS=EMPTY

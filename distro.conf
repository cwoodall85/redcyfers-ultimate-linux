# One place for the distro's identity. "Ultimate Linux" is a working name
# that matches the Ultimate Mail / SSH / Chat family; renaming the distro
# means changing these lines and the package prefix, nothing else.
DISTRO_ID=ultimate
DISTRO_NAME="Ultimate Linux"
DISTRO_PRETTY_NAME="Ultimate Linux (Arch-based)"
DISTRO_URL="https://github.com/cwoodall85/redcyfers-ultimate-linux"
DISTRO_PUBLISHER="Ultimate Linux <https://github.com/cwoodall85/redcyfers-ultimate-linux>"
# The model the Claude tools use unless the user configures another.
CLAUDE_MODEL=claude-opus-5
